server:
  port: ${PORT:8091}

consul:
  address: ${CONSUL_ADDRESS:host.docker.internal}
  port: ${CONSUL_PORT:8500}

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/bank-realm}
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${consul.address}
      port: ${consul.port}
      discovery:
        register: false
        registerHealthCheck: false
      config:
        format: YAML
        enabled: true            # Включаем Consul Config для внешней конфигурации
        prefix: config           # Префикс в KV-хранилище Consul (по умолчанию "config")
        watch:
          enabled: true
          wait-time: 30
        data-key: data
        defaultContext: application
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/account/**
              filters:
                  - RewritePath=/account/(?<path>.*), /$\{path}
                  - TokenRelay=

            - id: cash-service
              uri: lb://cash-service
              predicates:
                - Path=/cash/**
              filters:
                - RewritePath=/cash/(?<path>.*), /$\{path}
                - TokenRelay=

            - id: transfer-service
              uri: lb://transfer-service
              predicates:
                - Path=/transfer/**
              filters:
                - RewritePath=/transfer/(?<path>.*), /$\{path}
                - TokenRelay=

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
    health:
      show-details: always
