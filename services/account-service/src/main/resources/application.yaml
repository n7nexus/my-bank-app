spring:
  application:
    name: account-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm

      client:
        registration:
          account-service:
            provider: keycloak
            client-id: account-service
            client-secret: UwwjSq0B00J8eNv8pn4D7KA6JO4AhT2M
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/bank-realm
  cloud:
    consul:
#      host: localhost          # Адрес Consul (по умолчанию localhost)
#      port: 8500               # Порт Consul (8500 по умолчанию)
      discovery:
        ip-address: host.docker.internal
        prefer-ip-address: true
        enabled: true
        # Интервал проверки (по умолчанию 10s)
        health-check-interval: 15s
        # Таймаут проверки (если сервис медленно запускается, можно увеличить)
        health-check-timeout: 3s
#        service-name: transfers  # Необязательно, по умолчанию берётся spring.application.name
      config:
        format: YAML
        enabled: true            # Включаем Consul Config для внешней конфигурации
        prefix: config           # Префикс в KV-хранилище Consul (по умолчанию "config")
        watch:
          enabled: false
          wait-time: 30
        data-key: data
        defaultContext: application
  config:
    import: "optional:consul:localhost:8500"

  datasource:
    url: jdbc:postgresql://localhost:5432/bank
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver

    # 2. Connection Pool Tuning (HikariCP)
    hikari:
      pool-name: MyHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      schema: account

    # 3. Schema Management Strategy (Core)
    jpa:
      # Key point: Disable Hibernate's automatic table creation, use validate or none
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  liquibase:
    default-schema: account
    liquibase-schema: liquibase
    change-log: classpath:/db/changelog/changelog-master.yaml

server:
  port: 8100
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
#        include: mappings
        include: health,refresh
    health:
      show-details: always

logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway: DEBUG
        security: DEBUG
