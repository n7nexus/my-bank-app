server:
  port: ${PORT:8100}
  address: 0.0.0.0
  
consul:
  address: ${CONSUL_ADDRESS:host.docker.internal}
  port: ${CONSUL_PORT:8500}

spring:
  application:
    name: account-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/bank-realm}
      client:
        registration:
          account-service:
            provider: keycloak
            client-id: account-service
            client-secret: ${SERVICE_CLIENT_SECRET:5SoVhuhbJMLvGwxF83SnMNLWx1voOgdz} #hardcoded value for local dev
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/bank-realm}
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${consul.address}
      port: ${consul.port}
      discovery:
#        ip-address: ${consul.address} //для локальной разработки
        prefer-ip-address: true
        enabled: true
        health-check-interval: 15s
        health-check-timeout: 3s
      config:
        format: YAML
        enabled: true            # Включаем Consul Config для внешней конфигурации
        prefix: config           # Префикс в KV-хранилище Consul (по умолчанию "config")
        watch:
          enabled: true
          wait-time: 30
        data-key: data
        defaultContext: application

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: MyHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      schema: account

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  liquibase:
    default-schema: account
    liquibase-schema: liquibase
    change-log: classpath:/db/changelog/changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
    health:
      show-details: always

bank:
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service}
