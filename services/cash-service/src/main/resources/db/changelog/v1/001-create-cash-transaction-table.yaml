databaseChangeLog:
    - changeSet:
        id: 1
        author: Denis Sablukov
        changes:
            - createTable:
                tableName: cash_transaction
                columns:
                    - column:
                        name: id
                        type: bigint
                        autoIncrement: true
                        constraints:
                            primaryKey: true
                            nullable: false
                    - column:
                        name: account_id
                        type: varchar(100)
                    - column:
                        name: action
                        type: varchar(3)
                    - column:
                        name: amount
                        type: decimal
                        defaultValue: 0
                        constraints:
                            nullable: false
                    - column:
                        name: created_at
                        type: timestamp
                        defaultValueComputed: CURRENT_TIMESTAMP