databaseChangeLog:
  - changeSet:
      id: 2
      author: Denis Sablukov
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: time
                  type: TIMESTAMP
              - column:
                  name: account_id
                  type: VARCHAR(100)
              - column:
                  name: action
                  type: VARCHAR(255)
              - column:
                  name: details
                  type: VARCHAR(255)
              - column:
                  name: result
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP