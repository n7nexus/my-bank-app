spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm

      client:
        registration:
          notification-service:
            provider: keycloak
            client-id: notification-service
            client-secret: kmem4rZ7Lv2RXN3G5Z79UbFCfDvTZw6z
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/bank-realm
  cloud:
    consul:
      #      host: localhost          # Адрес Consul (по умолчанию localhost)
      #      port: 8500               # Порт Consul (8500 по умолчанию)
      discovery:
        ip-address: host.docker.internal
        prefer-ip-address: true
        enabled: true
        # Интервал проверки (по умолчанию 10s)
        health-check-interval: 15s
        # Таймаут проверки (если сервис медленно запускается, можно увеличить)
        health-check-timeout: 3s
      #        service-name: transfers  # Необязательно, по умолчанию берётся spring.application.name
      config:
        format: YAML
        enabled: true            # Включаем Consul Config для внешней конфигурации
        prefix: config           # Префикс в KV-хранилище Consul (по умолчанию "config")
        watch:
          enabled: false
          wait-time: 30
        data-key: data
        defaultContext: application
  config:
    import: "optional:consul:localhost:8500"

server:
  port: 8130
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        #        include: mappings
        include: health,refresh
    health:
      show-details: always

logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway: DEBUG
        security: DEBUG