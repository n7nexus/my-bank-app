services:
  bank-db:
    image: "postgres:18-alpine"
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d/
    environment:
      BANK_POSTGRES_USER: bank
      BANK_POSTGRES_PASSWORD: bank
      BANK_POSTGRES_DB: bank
      BANK_POSTGRES_DB_SCHEMA: bank
      POSTGRES_PASSWORD: postgres
    container_name: bank_db_postgres

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: bank-keycloak
    command:
      - start-dev
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"