services:
  bank-db:
    image: "postgres:18-alpine"
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d/
    environment:
      BANK_POSTGRES_USER: bank
      BANK_POSTGRES_PASSWORD: bank
      BANK_POSTGRES_DB: bank
      ACCOUNT_POSTGRES_DB_SCHEMA: account
      TRANSFER_POSTGRES_DB_SCHEMA: transfer
      CASH_POSTGRES_DB_SCHEMA: cash
      POSTGRES_PASSWORD: postgres
    container_name: my_bank_db_postgres

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: my_bank_keycloak
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms/bank-realm.json:/opt/keycloak/data/import/my-realm.json

  consul:
    image: hashicorp/consul:1.15.4
    container_name: my_bank_consul
    ports:
      - "8500:8500"   # HTTP API и Web UI
      - "8600:8600/tcp" # DNS (TCP)
      - "8600:8600/udp" # DNS (UDP)
    command: agent -dev -client=0.0.0.0 -ui
    restart: unless-stopped